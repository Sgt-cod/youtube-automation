name: Gerar Vídeo Filosófico

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:
    inputs:
      tema_manual:
        description: 'Tema específico (deixe vazio para automático)'
        required: false
        default: ''

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TTS_HOME: /home/runner/.local/share/tts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cache de pacotes pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py311-

      - name: Cache do modelo Coqui TTS
        uses: actions/cache@v4
        id: cache-tts
        with:
          path: /home/runner/.local/share/tts
          key: coqui-tts-model-pt-cv-vits-v1

      - name: Instalar PyTorch e torchaudio (CPU)
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Fixar versão do transformers compatível com Coqui
        run: pip install transformers==4.44.2

      - name: Instalar demais dependências
        run: pip install -r requirements.txt --no-deps coqui-tts || pip install -r requirements.txt

      - name: Garantir transformers não foi sobrescrito
        run: pip install transformers==4.44.2 --force-reinstall

      - name: Pré-baixar modelo Coqui (somente se não estiver em cache)
        if: steps.cache-tts.outputs.cache-hit != 'true'
        run: |
          python - <<'EOF'
          import os
          os.environ['TTS_HOME'] = '/home/runner/.local/share/tts'
          from TTS.api import TTS
          print("⬇️ Baixando modelo tts_models/pt/cv/vits (~50MB)...")
          tts = TTS(model_name='tts_models/pt/cv/vits', progress_bar=True)
          print("✅ Modelo baixado e salvo em cache")
          EOF

      - name: Confirmar modelo em cache
        if: steps.cache-tts.outputs.cache-hit == 'true'
        run: echo "✅ Modelo Coqui carregado do cache — etapa de download ignorada"

      - name: Sobrescrever tema se fornecido manualmente
        if: ${{ github.event.inputs.tema_manual != '' }}
        run: |
          python - <<EOF
          import json
          tema = "${{ github.event.inputs.tema_manual }}"
          with open('config.json', 'r', encoding='utf-8') as f:
              cfg = json.load(f)
          cfg['temas'].insert(0, tema)
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print(f"Tema manual injetado: {tema}")
          EOF

      - name: Gerar vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          TTS_HOME: /home/runner/.local/share/tts
        run: python generate_video.py

      - name: Salvar log como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: videos_gerados.json
          retention-days: 30
          if-no-files-found: ignore
