name: Gerar Shorts automaticamente

on:
  schedule:
    - cron: "0 12 * * *"  # todo dia 12h UTC (9h Brasilia) - ajuste como quiser
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID do video do YouTube"
        required: false

permissions:
  contents: write

jobs:
  gerar-shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=10
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Gerar cookies.txt para o yt-dlp
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            printf '%s' "$YOUTUBE_COOKIES_TXT" > cookies.txt
            echo "cookies.txt gerado."
          else
            echo "Secret YOUTUBE_COOKIES_TXT nao configurado, seguindo sem cookies."
          fi

      - name: Rodar pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_SECRETS: client_secrets.json
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}" > client_secrets.json
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" > token.json
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            python pipeline.py --video-id "${{ github.event.inputs.video_id }}"
          else
            python pipeline.py
          fi

      - name: Salvar historico de videos processados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain processed_videos.json)" ]; then
            git add processed_videos.json
            git commit -m "chore: atualiza processed_videos.json [skip ci]"
            git push
          else
            echo "Nada novo para commitar."
          fi

# Configure em Settings > Secrets and variables > Actions do seu repo:
# YOUTUBE_API_KEY, GEMINI_API_KEY, YOUTUBE_CLIENT_SECRETS_JSON, YOUTUBE_TOKEN_JSON, YOUTUBE_COOKIES_TXT
# (token.json e gerado localmente na primeira autorizacao OAuth, ver upload_short.py)
# (cookies.txt e exportado do navegador logado no YouTube, formato Netscape, ver docs do yt-dlp)
