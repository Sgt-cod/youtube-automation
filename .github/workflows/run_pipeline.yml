name: Gerar Shorts automaticamente

on:
  schedule:
    - cron: "0 10 * * *"  # 7h Brasilia (UTC-3)
    - cron: "0 16 * * *"  # 13h Brasilia (UTC-3)
    - cron: "0 22 * * *"  # 19h Brasilia (UTC-3)
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID do video do YouTube"
        required: false

permissions:
  contents: write

jobs:
  gerar-shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl
          ffmpeg -version

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Deno (runtime JS exigido pelo yt-dlp)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Atualizar yt-dlp para a ultima versao
        run: pip install -U yt-dlp

      - name: Gerar cookies.txt para o yt-dlp
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            printf '%s' "$YOUTUBE_COOKIES_TXT" > cookies.txt
            echo "cookies.txt gerado."
          else
            echo "Secret YOUTUBE_COOKIES_TXT nao configurado, seguindo sem cookies."
          fi

      - name: Rodar pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            python pipeline.py --video-id "${{ github.event.inputs.video_id }}"
          else
            python pipeline.py
          fi

      - name: Salvar historico de videos processados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain processed_videos.json)" ]; then
            git add processed_videos.json
            git commit -m "chore: atualiza processed_videos.json [skip ci]"
            git push
          else
            echo "Nada novo para commitar."
          fi

# Configure em Settings > Secrets and variables > Actions do seu repo:
# YOUTUBE_API_KEY, GEMINI_API_KEY, YOUTUBE_CREDENTIALS, YOUTUBE_COOKIES_TXT
# (YOUTUBE_CREDENTIALS e gerado rodando gerar_credenciais_youtube.py localmente, uma unica vez)
# (cookies.txt e exportado do navegador logado no YouTube, formato Netscape, ver docs do yt-dlp)
